name: Build DevBuild
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm build --standalone

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Clean up obsolete files
              run: |
                  rm -rf dist/*-unpacked dist/vendor dist/desktop Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

            - name: Get some values needed for the release
              id: release_values
              run: |
                  echo "release_tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Upload DevBuild as release
              if: github.repository == 'Ernest1101/Sudocord'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.release_tag }}
              run: |
                  OLD_HASH=$(gh release view devbuild --json name -q .name 2>/dev/null | awk '{print $2}')
                  gh release delete devbuild --yes 2>/dev/null || true
                  ok=0
                  for i in 1 2 3; do
                      if gh release create devbuild --prerelease --title "DevBuild $RELEASE_TAG" --notes " "; then ok=1; break; fi
                      echo "create attempt $i failed, retrying in 15s"
                      sleep 15
                  done
                  [ "$ok" = "1" ] || exit 1
                  ok=0
                  for i in 1 2 3; do
                      if gh release upload devbuild dist/* --clobber; then ok=1; break; fi
                      echo "upload attempt $i failed, retrying in 15s"
                      sleep 15
                  done
                  [ "$ok" = "1" ] || exit 1
                  if [ -n "$OLD_HASH" ]; then
                      CHANGELOG=$(git log --oneline --no-decorate "$OLD_HASH..HEAD" -- src | sed "s/^/- /")
                  fi
                  if [ -z "$CHANGELOG" ]; then
                      CHANGELOG="- Техническое обновление: изменений клиента нет"
                  fi
                  gh release edit devbuild --title "DevBuild $RELEASE_TAG" --notes "$CHANGELOG"
